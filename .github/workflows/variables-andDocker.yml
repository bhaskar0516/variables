name: without secrets pipeline
on: push
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: artifacts
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t bhaskar0516/nginx3:latest .

      - name: Docker credentails
        run: docker login --username=bhaskar0516 --password=Docker@516

      - name: Docker login
        run: docker push bhaskar0516/nginx3:latest

  deploy-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Docker deploy
        run: docker run -d -p 8080:80 bhaskar0516/nginx3:latest
      
      